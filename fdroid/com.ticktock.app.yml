AutoName: TickTock
Summary: Pendulum clock beat asymmetry analyzer
Description: |-
  TickTock helps set the beat of a pendulum clock.

  The app listens through the device microphone, detects alternating left/right
  beats, and estimates:
  . Period [ms]
  . Asymmetry [ms]
  . Asymmetry [%]

  A gauge displays asymmetry from -25% to +25% with color-coded guidance.

